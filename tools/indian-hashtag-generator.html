/* ================= HELPERS ================= */
function normalize(t){return t.toLowerCase().replace(/[^a-z0-9\s]/g," ");}
function wordMatch(text,arr){
 const words=normalize(text).split(/\s+/);
 return arr.some(tag=>{
  const clean=normalize(tag);
  return words.some(w=>clean.includes(w) && w.length>2);
 });
}
function shuffleCopy(arr){return [...arr].sort(()=>Math.random()-0.5);}
function detectGod(text){
 for(const g in gods){if(text.includes(g)) return g;}
 return null;
}
function rotate(arr,count){
 if(arr.length<=count) return arr;
 const start=Math.floor(Math.random()*(arr.length-count+1));
 return arr.slice(start,start+count);
}
function format(tags){
 return tags.filter(t=>!allBanned.includes(t))
 .map(t=>"#"+t.replace(/\s+/g,"")).join(" ");
}

/* ================= MAIN ================= */
function generate(){
 const topic=normalize(document.getElementById("topic").value.trim());
 const platform=document.getElementById("platform").value;
 const type=document.getElementById("type").value;
 const out=document.getElementById("output");
 if(!topic){out.innerHTML="<div class='card'>Enter any Indian topic.</div>";return;}

 let tags=[];
 const god=detectGod(topic);
 if(god){tags=[...gods[god],"hindubhakti","indiadevotion","bhaktiindia"];}
 else if(wordMatch(topic,indianFoods)){tags=[...indianFoods];}
 else if(wordMatch(topic,indianPlaces)){tags=[...indianPlaces];}
 else if(wordMatch(topic,indianProducts)){tags=[...indianProducts];}
 else if(wordMatch(topic,indianFestivals)){tags=[...indianFestivals];}
 else if(wordMatch(topic,indianCareer)){tags=[...indianCareer];}
 else if(wordMatch(topic,indianTech)){tags=[...indianTech];}
 else if(wordMatch(topic,indianLife)){tags=[...indianLife];}
 else{
  const w=topic.split(/\s+/);
  tags=[w.join(""),...w,"trendingindia","viralindia","desicontent"];
 }
 const final=rotate(shuffleCopy(tags),limits[platform][type]);
 out.innerHTML=`
 <div class="card">
  <strong>🔥 Generated Hashtags</strong>
  <textarea readonly>${format(final)}</textarea>
  <button class="copy" onclick="copy(this)">Copy</button>
  <div class="badge">Platform: ${platform.toUpperCase()} | Type: ${type.toUpperCase()}</div>
 </div>`;
}
function copy(btn){
 const ta=btn.previousElementSibling;
 ta.select();document.execCommand("copy");
 btn.innerText="Copied";setTimeout(()=>btn.innerText="Copy",1200);
}

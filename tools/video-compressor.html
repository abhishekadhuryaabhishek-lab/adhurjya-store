<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Compressor — Adhurjya Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Professional video compression tool. Compress MP4, WebM, MOV videos while preserving quality. 100% browser-side.">

<style>
:root{
  --accent:#22c55e;
  --accent-hover:#16a34a;
  --bg:#020617;
  --bg-soft:#0f172a;
  --card:#111827;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#1e293b;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 4px 16px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:linear-gradient(160deg,#020617 0%,#0f172a 100%);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
}
header{
  background:rgba(2,6,23,0.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
}
.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{font-weight:700;font-size:1.1rem}
.back{
  color:var(--accent);
  text-decoration:none;
  font-size:0.875rem;
  padding:8px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
}
.container{max-width:800px;margin:auto;padding:40px 20px}
h1{text-align:center;margin-bottom:8px;font-size:2rem}
.subtitle{text-align:center;color:var(--muted);margin-bottom:32px;font-size:0.95rem}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:20px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.field{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-size:0.9rem;font-weight:500}
.file-input-wrapper{
  border:2px dashed var(--border);
  border-radius:var(--radius);
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  background:var(--bg-soft);
  position:relative;
}
.file-input-wrapper:hover{border-color:var(--accent)}
.file-input-wrapper input{position:absolute;inset:0;opacity:0;cursor:pointer}
select{
  width:100%;
  padding:12px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--bg-soft);
  color:var(--text);
  font-size:0.9rem;
}
.btn{
  width:100%;
  padding:14px;
  font-size:1rem;
  font-weight:600;
  border:none;
  border-radius:var(--radius-sm);
  background:var(--accent);
  color:#000;
  cursor:pointer;
}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.progress-section{
  margin-top:20px;
  padding:16px;
  background:var(--bg-soft);
  border-radius:var(--radius-sm);
}
.progress-bar-outer{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:10px 0}
.progress-bar-inner{height:100%;width:0%;background:var(--accent);transition:width 0.2s}
.result-section{margin-top:24px;display:none}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:600px){.preview-grid{grid-template-columns:1fr}}
.preview-box video{width:100%;border-radius:var(--radius-sm);background:#000}
.preview-label{font-size:0.8rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase}
.savings{
  text-align:center;
  padding:16px;
  background:rgba(34,197,94,0.1);
  border:1px solid var(--accent);
  border-radius:var(--radius);
  margin-bottom:20px;
}
.savings-val{font-size:1.5rem;font-weight:700;color:var(--accent)}
.loading-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.loading-overlay.hidden{display:none}
.spinner{
  width:40px;
  height:40px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="loading-overlay" class="loading-overlay">
  <div class="spinner"></div>
  <div style="margin-top:20px" id="loading-msg">Initializing Video Encoder...</div>
  <div style="font-size:0.8rem;color:var(--muted);margin-top:10px">This may take a moment on first load</div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">Adhurjya Store</div>
    <a href="../index.html" class="back">← Back</a>
  </div>
</header>

<div class="container">
  <h1>Video Compressor</h1>
  <p class="subtitle">High-quality compression, 100% in-browser.</p>

  <div class="card">
    <div class="field">
      <label>Upload Video (MP4, WebM, MOV)</label>
      <div class="file-input-wrapper">
        <input type="file" id="video-input" accept="video/*">
        <div id="file-name">Click to select or drag & drop</div>
      </div>
    </div>
    
    <div class="field">
      <label>Compression Quality</label>
      <select id="quality-select">
        <option value="22">High Quality (Larger file)</option>
        <option value="26" selected>Medium (Recommended)</option>
        <option value="30">Low Quality (Smaller file)</option>
      </select>
    </div>

    <div class="field">
      <label>Resolution</label>
      <select id="res-select">
        <option value="original">Original</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </div>

    <button id="compress-btn" class="btn" disabled>Compress Video</button>

    <div id="progress-section" style="display:none" class="progress-section">
      <div style="display:flex;justify-content:space-between;font-size:0.9rem">
        <span id="status-text">Processing...</span>
        <span id="pct-text">0%</span>
      </div>
      <div class="progress-bar-outer">
        <div id="progress-bar" class="progress-bar-inner"></div>
      </div>
    </div>
  </div>

  <div id="result-section" class="result-section">
    <div class="savings">
      <div class="savings-val" id="savings-pct">0% Smaller</div>
      <div style="font-size:0.9rem;color:var(--muted)" id="savings-detail">Saved 0MB</div>
    </div>

    <div class="preview-grid">
      <div class="preview-box">
        <div class="preview-label">Original</div>
        <video id="v-orig" controls></video>
        <div style="font-size:0.8rem;margin-top:5px" id="orig-meta"></div>
      </div>
      <div class="preview-box">
        <div class="preview-label">Compressed</div>
        <video id="v-comp" controls></video>
        <div style="font-size:0.8rem;margin-top:5px" id="comp-meta"></div>
      </div>
    </div>

    <button id="dl-btn" class="btn">Download Compressed Video</button>
  </div>
</div>

<script type="module">
import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm';
import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm';

let ffmpeg = null;
let currentFile = null;
let outputBlob = null;

async function init() {
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingMsg = document.getElementById('loading-msg');
  
  try {
    ffmpeg = new FFmpeg();
    
    // Fix for cross-origin worker issue
    const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
    const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
    const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');
    
    // We use a blob URL for the worker to avoid origin issues
    const workerURL = await toBlobURL('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/worker.js', 'text/javascript');

    await ffmpeg.load({
      coreURL,
      wasmURL,
      classWorkerURL: workerURL
    });

    document.getElementById('compress-btn').disabled = false;
    loadingOverlay.classList.add('hidden');
  } catch (err) {
    console.error(err);
    loadingMsg.innerHTML = '<span style="color:red">Failed to load encoder.</span><br><small>' + err.message + '</small>';
  }
}

const input = document.getElementById('video-input');
input.onchange = (e) => {
  if (e.target.files[0]) {
    currentFile = e.target.files[0];
    document.getElementById('file-name').textContent = currentFile.name;
    document.getElementById('orig-meta').textContent = (currentFile.size / 1024 / 1024).toFixed(2) + ' MB';
    document.getElementById('v-orig').src = URL.createObjectURL(currentFile);
  }
};

document.getElementById('compress-btn').onclick = async () => {
  if (!currentFile || !ffmpeg) return;

  const btn = document.getElementById('compress-btn');
  const prog = document.getElementById('progress-section');
  const bar = document.getElementById('progress-bar');
  const pctText = document.getElementById('pct-text');
  
  btn.disabled = true;
  prog.style.display = 'block';
  document.getElementById('result-section').style.display = 'none';

  ffmpeg.on('progress', ({ progress }) => {
    const p = Math.round(progress * 100);
    bar.style.width = p + '%';
    pctText.textContent = p + '%';
  });

  const ext = currentFile.name.split('.').pop();
  const inName = `in.${ext}`;
  const outName = 'out.mp4';

  await ffmpeg.writeFile(inName, await fetchFile(currentFile));

  const crf = document.getElementById('quality-select').value;
  const res = document.getElementById('res-select').value;
  
  let args = ['-i', inName, '-c:v', 'libx264', '-crf', crf, '-preset', 'veryfast', '-c:a', 'aac', '-b:a', '128k'];
  
  if (res !== 'original') {
    args.push('-vf', `scale=-2:${res}`);
  }
  args.push(outName);

  await ffmpeg.exec(args);

  const data = await ffmpeg.readFile(outName);
  outputBlob = new Blob([data.buffer], { type: 'video/mp4' });
  
  const vComp = document.getElementById('v-comp');
  vComp.src = URL.createObjectURL(outputBlob);
  
  const savings = ((currentFile.size - outputBlob.size) / currentFile.size * 100).toFixed(1);
  document.getElementById('savings-pct').textContent = savings + '% Smaller';
  document.getElementById('savings-detail').textContent = `From ${(currentFile.size/1024/1024).toFixed(2)}MB to ${(outputBlob.size/1024/1024).toFixed(2)}MB`;
  
  document.getElementById('result-section').style.display = 'block';
  btn.disabled = false;
  prog.style.display = 'none';
};

document.getElementById('dl-btn').onclick = () => {
  if (!outputBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(outputBlob);
  a.download = 'compressed_video.mp4';
  a.click();
};

init();
</script>

</body>
</html>
